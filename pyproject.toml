[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mova"
version = "0.1.0"
description = "Mova — generalizable motion intelligence for HAR and clinical gait from IMU data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Kassymzhomart Shubay", email = "kassymzhomart.shubay@nu.edu.kz" }]
keywords = ["imu", "human-activity-recognition", "freezing-of-gait", "self-supervised", "wearables"]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "polars>=1.0",
  "pyarrow>=15.0",
  "pandas>=2.1",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
ml = [
  "torch>=2.2",
  "lightning>=2.2",
  "einops>=0.7",
  "hydra-core>=1.3",
  "wandb>=0.16",
  "scikit-learn>=1.4",
]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "onnxruntime>=1.17"]
data = ["dvc[s3]>=3.50"]
dev = [
  "ruff>=0.4",
  "black>=24.4",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pre-commit>=3.7",
  "pandas-stubs",
  "types-PyYAML",
]

[project.scripts]
mova-adapt-hhar = "mova.data.adapters.hhar_adapter:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mova"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mova"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["polars.*", "pyarrow.*", "scipy.*", "sklearn.*", "wandb.*", "typer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=mova --cov-report=term-missing"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/mova"]
branch = true
